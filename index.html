<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot - 多機能Discordボット</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- ヘッダー -->
    <header>
        <div class="logo">
            MyBot
        </div>
        <nav>
            <a href="index.html">ホーム</a>
            <a href="html/commands.html">コマンド</a>
            <a href="https://github.com/your-username/your-repo" target="_blank"><i class="fa-brands fa-github"></i> GitHub</a>
        </nav>
    </header>

    <!-- ヒーローセクション -->
    <section class="hero">
        <div class="hero-content">
            <h1>あなたのサーバーをもっと便利に、楽しく。</h1>
            <p>音楽再生、モデレーション、カスタム機能まで完備した次世代型Discordボット。</p>
            <div class="hero-buttons">
                <a href="https://discord.com/oauth2/authorize?client_id=1528013651384991754&permissions=2147551232&integration_type=0&scope=applications.commands+bot" class="btn-primary" target="_blank">
                    <i class="fa-brands fa-discord"></i> サーバーに追加
                </a>
                <a href="html/commands.html" class="btn-secondary">コマンドを見る</a>
            </div>
        </div>
    </section>

    <!-- 特徴セクション -->
    <section class="features">
        <h2>主な機能</h2>
        <div class="feature-grid">
            <div class="feature-card">
                <i class="fa-solid fa-bolt"></i>
                <h3>超高速レスポンス</h3>
                <p>最適化されたコードにより、遅延のないスムーズなコマンド実行を実現しています。</p>
            </div>
            <div class="feature-card">
                <i class="fa-solid fa-shield-halved"></i>
                <h3>強力なセキュリティ</h3>
                <p>自動モデレーション機能で荒らしやスパムからサーバーを24時間ガードします。</p>
            </div>
            <div class="feature-card">
                <i class="fa-solid fa-music"></i>
                <h3>高音質ミュージック</h3>
                <p>お気に入りの楽曲をラグなく高音質で再生。プレイリストにも対応。</p>
            </div>
        </div>
    </section>

    <!-- フッター -->
    <footer>
        <p>&copy; 2026 MyBot Project. All rights reserved.</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
