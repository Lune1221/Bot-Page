<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>コマンド一覧 - MyBot</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- ヘッダー -->
    <header>
        <div class="logo">
            <i class="fa-solid fa-robot"></i> MyBot
        </div>
        <nav>
            <a href="../index.html">ホーム</a>
            <a href="commands.html">コマンド</a>
            <a href="https://github.com/your-username/your-repo" target="_blank"><i class="fa-brands fa-github"></i> GitHub</a>
        </nav>
    </header>

    <!-- コマンドセクション -->
    <section class="features">
        <h2>コマンドリスト</h2>
        <div class="feature-grid" style="text-align: left;">
            <div class="feature-card">
                <h3><code>/help</code></h3>
                <p>ボットのヘルプメニューや全コマンドの一覧を表示します。</p>
            </div>
            <div class="feature-card">
                <h3><code>/play &lt;url&gt;</code></h3>
                <p>ボイスチャンネルに参加し、指定したURLの音楽を再生します。</p>
            </div>
            <div class="feature-card">
                <h3><code>/ban &lt;user&gt;</code></h3>
                <p>指定したメンバーをサーバーからBANします（要管理者権限）。</p>
            </div>
        </div>
    </section>

    <!-- フッター -->
    <footer>
        <p>&copy; 2026 MyBot Project. All rights reserved.</p>
    </footer>

    <script src="../js/main.js"></script>
</body>
</html>
